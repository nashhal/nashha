<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نشهل | الخبر</title><meta name="description" content="خبر من منصة نشهل الإخبارية"><style>:root{--bg:#f1f2f4;--surface:#fff;--ink:#14202b;--muted:#687482;--line:#d7dde3;--accent:#0B2A4A;--accent2:#1F5A8A;--soft:#eef3f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:2}.wrap{width:min(900px,calc(100% - 28px));margin:auto}.top{background:var(--accent);color:#fff;padding:10px 0;font-size:12px}.top a{color:#fff;text-decoration:none}.head{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 0}.brand{font-weight:900;font-size:30px;text-decoration:none;color:var(--ink)}.back{float:left;margin-top:8px;color:var(--accent2);text-decoration:none;font-weight:700}.article{margin:30px 0 50px;background:var(--surface);border:1px solid var(--line);padding:30px;box-shadow:0 10px 30px rgba(11,42,74,.07)}.label{color:var(--accent2);font-weight:800;font-size:12px}.title{font-weight:900;font-size:31px;line-height:1.65;margin:10px 0}.meta{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:15px}.cover{width:100%;max-height:500px;object-fit:cover;margin:22px 0;border-radius:3px;background:var(--soft)}.summary{font-size:18px;font-weight:700}.body{font-size:17px}.source{margin-top:30px;padding:16px;background:var(--soft);border-right:4px solid var(--accent);font-size:13px}.source a{color:var(--accent2);font-weight:800}.embed{margin:28px auto;display:flex;justify-content:center}.embed iframe{max-width:100%;border:0}.embed-note{font-size:12px;color:var(--muted);text-align:center}.notice{margin-top:12px;color:var(--muted);font-size:11px}@media(max-width:600px){.article{padding:20px}.title{font-size:23px}.body{font-size:16px}}</style></head><body><div class="top"><div class="wrap"><a href="index.html">نشهل</a> · منصة إخبارية يمنية</div></div><header class="head"><div class="wrap"><a class="brand" href="index.html">نشهل</a><a class="back" href="index.html">← العودة للأخبار</a></div></header><main class="wrap"><article class="article" id="article"><div class="label" id="category">الجنوب</div><h1 class="title" id="title">جاري تحميل الخبر...</h1><div class="meta" id="meta"></div><img class="cover" id="cover" alt="صورة الخبر" hidden><p class="summary" id="summary"></p><div class="body" id="body"></div><div class="embed" id="embed"></div><div class="source"><strong>المصدر:</strong> <a id="source" target="_blank" rel="noopener noreferrer">المصدر الأصلي</a><div class="notice">تنشر نشهل الأخبار بصياغة تحريرية مستقلة، مع إتاحة المصدر الأصلي للتحقق والاطلاع. عند توفر منشور X أو Facebook سيظهر داخل الخبر عبر التضمين الرسمي.</div></div></article></main><script>const params=new URLSearchParams(location.search),id=params.get('id');function esc(s){return String(s||'').replace(/[&<>\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]))}function showEmbed(n){const box=document.getElementById('embed');if(n.platform==='X'&&n.embed_url){box.innerHTML='<blockquote class="twitter-tweet"><a href="'+esc(n.embed_url)+'"></a></blockquote><div class="embed-note">منشور X الأصلي</div>';const s=document.createElement('script');s.src='https://platform.twitter.com/widgets.js';s.async=true;box.appendChild(s)}else if(n.platform==='Facebook'&&n.embed_url){const u=encodeURIComponent(n.embed_url);box.innerHTML='<iframe title="Facebook post" src="https://www.facebook.com/plugins/post.php?href='+u+'&show_text=true&width=500" width="500" height="600" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>'}}async function load(){try{const r=await fetch('data/news.json?'+Date.now());if(!r.ok)throw 0;const data=await r.json(),list=Array.isArray(data)?data:(data.news||[]),n=list.find(x=>String(x.id||x.url||x.link)===String(id))||list.find(x=>String(x.url||x.link)===String(id));if(!n)throw 0;document.title='نشهل | '+(n.title||'خبر');document.getElementById('category').textContent=n.category||'الجنوب';document.getElementById('title').textContent=n.title||'خبر';document.getElementById('meta').textContent=[n.date||n.published||n.published_at||'',n.author?'بقلم '+n.author:''].filter(Boolean).join(' · ');document.getElementById('summary').textContent=n.summary||n.description||'';document.getElementById('body').innerHTML=(n.content||n.body||n.summary||'').split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');const img=n.image||n.image_url||n.thumbnail;if(img){const c=document.getElementById('cover');c.src=img;c.hidden=false}const s=document.getElementById('source');s.href=n.source_url||n.url||n.link||'#';s.textContent=n.source||n.source_name||'المصدر الأصلي';showEmbed(n)}catch(e){document.getElementById('title').textContent='لم يتم العثور على الخبر';document.getElementById('summary').textContent='قد يكون الخبر غير متاح حاليًا أو لم تتم مزامنته بعد.'}}load();</script></body></html>
