<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2A4A"><meta name="description" content="خبر من منصة نشهل الإخبارية"><title>نشهل | الخبر</title><style>:root{--bg:#f4f6f8;--surface:#fff;--ink:#111820;--muted:#66727e;--line:#dfe5ea;--accent:#0B2A4A;--accent2:#1F5A8A;--soft:#eef2f6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Tahoma",sans-serif;line-height:2}.wrap{width:min(920px,calc(100% - 28px));margin:auto}.top{background:var(--accent);color:#fff;padding:8px 0;font-size:12px}.top .wrap{display:flex;justify-content:space-between;align-items:center}.head{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 0}.brand{font-weight:900;font-size:28px;text-decoration:none;color:var(--accent)}.back{float:left;margin-top:7px;color:var(--accent2);text-decoration:none;font-weight:800}.article{margin:28px 0 55px;background:var(--surface);border:1px solid var(--line);padding:32px;box-shadow:0 12px 34px rgba(10,32,55,.06)}.label{color:var(--accent2);font-weight:900;font-size:12px}.title{font-weight:900;font-size:clamp(25px,4vw,39px);line-height:1.6;margin:10px 0}.meta{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:16px}.cover{width:100%;max-height:520px;object-fit:cover;margin:22px 0;border-radius:6px;background:var(--soft)}.summary{font-size:18px;font-weight:800;color:#24313d}.body{font-size:17px}.body p{margin:0 0 16px}.source{margin-top:34px;padding:17px;background:var(--soft);border-right:4px solid var(--accent);font-size:12px}.source a{display:inline-block;margin-top:7px;color:var(--accent2);font-weight:900}.notice{margin-top:7px;color:var(--muted);font-size:10px}@media(max-width:600px){.article{padding:20px}.title{font-size:24px}.body{font-size:16px}.summary{font-size:16px}.top .wrap{width:calc(100% - 20px)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><div class="top"><div class="wrap"><span>نشهل · منصة إخبارية يمنية</span><span>الخبر · التفاصيل · المتابعة</span></div></div><header class="head"><div class="wrap"><a class="brand" href="index.html">نشهل</a><a class="back" id="backText" href="index.html">← العودة للأخبار</a></div></header><main class="wrap"><article class="article" id="article"><div class="label" id="category">الجنوب</div><h1 class="title" id="title">جاري تحميل الخبر...</h1><div class="meta" id="meta"></div><img class="cover" id="cover" alt="" hidden fetchpriority="high"><p class="summary" id="summary"></p><div class="body" id="body"></div><div class="source"><strong>المرجع الأصلي</strong><br><a id="source" target="_blank" rel="noopener noreferrer">فتح المرجع للمراجعة</a><div class="notice">تنشر نشهل المادة بصياغة تحريرية مستقلة، ويتيح الرابط مراجعة المرجع الأصلي.</div></div></article></main><script>const params=new URLSearchParams(location.search),id=params.get('id');const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]));const lang=()=>localStorage.getItem('nahshal-language')||'ar';function applyLang(){const en=lang()==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.title=en?'Nashhal | News':'نشهل | الخبر';document.getElementById('backText').textContent=en?'← Back to news':'← العودة للأخبار';document.querySelector('.source strong').textContent=en?'Original reference':'المرجع الأصلي';document.getElementById('source').textContent=en?'Open reference':'فتح المرجع للمراجعة'}async function load(){try{const r=await fetch('data/news.json',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),list=Array.isArray(d)?d:(d.news||d.items||[]),n=list.find(x=>String(x.id||x.url||x.link)===String(id))||list.find(x=>String(x.url||x.link)===String(id));if(!n)throw 0;document.getElementById('category').textContent=n.category||'الجنوب';document.getElementById('title').textContent=n.title||'خبر';document.getElementById('meta').textContent=[n.published||n.published_at||n.pubDate||n.date||'',n.author?'بقلم '+n.author:''].filter(Boolean).join(' · ');document.getElementById('summary').textContent=n.summary||n.description||'';document.getElementById('body').innerHTML=(n.content||n.body||n.summary||'').split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');const img=n.image||n.image_url||n.thumbnail;if(img){const c=document.getElementById('cover');c.src=img;c.hidden=false}document.getElementById('source').href=n.source_url||n.url||n.link||'#';applyLang();}catch(e){document.getElementById('title').textContent='لم يتم العثور على الخبر';document.getElementById('summary').textContent='قد يكون الخبر غير متاح حاليًا أو لم تتم مزامنته بعد.'}}load();window.addEventListener('storage',applyLang);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
