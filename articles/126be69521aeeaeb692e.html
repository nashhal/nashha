<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Al-Thawra Newspaper | Redirecting</title>
<style>body{margin:0;background:#f3f0e9;color:#111b20;font:16px/1.7 'IBM Plex Sans',Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.box{background:#fffdf8;border:1px solid #cfd5d7;padding:28px;text-align:center}a{color:#1d5e4a}</style>
</head>
<body>
<div class="box"><p>This story is being opened in the English article viewer.</p><a id="fallback" href="../article.html">Continue to Al-Thawra Newspaper</a></div>
<script>
(function(){
  const file=decodeURIComponent(location.pathname.split('/').pop()||'').replace(/\.html$/,'');
  if(file) location.replace('../article.html?id='+encodeURIComponent(file));
})();
</script>
</body>
</html>
