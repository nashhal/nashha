name: News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: news-bot-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Collect news
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/news_bot_v2.py
      - name: Analyze news with AI
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/ai_analysis.py
      - name: Commit updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nashhal-news-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if git diff --cached --quiet; then echo 'لا توجد تحديثات.'; exit 0; fi
          git commit -m 'تحديث الأخبار وتحليلها بالذكاء الاصطناعي'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
