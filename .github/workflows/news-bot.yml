name: Nashhal Newsroom

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/newsroom/**'
      - 'scripts/news_quality_gate.py'
      - 'scripts/ai_analysis.py'
      - 'scripts/build_site.py'
      - 'scripts/build_provenance.py'
      - '.github/workflows/news-bot.yml'
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: newsroom-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 1 · جمع الأخبار
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: python -m scripts.newsroom.orchestrator

      - name: 2 · بوابة النشر
        run: python scripts/news_quality_gate.py

      - name: 3 · فحص بنية المخرجات
        run: python -m scripts.newsroom.self_check

      - name: 4 · إنشاء التحليل التحريري
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: python scripts/ai_analysis.py

      - name: 5 · بناء صفحات الأخبار وخرائط الموقع
        run: python scripts/build_site.py

      - name: 6 · بناء سجل Nashhal Trust
        run: python scripts/build_provenance.py

      - name: Commit newsroom output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nashhal-news-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/provenance.json articles sitemap.xml news-sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo 'لا توجد تحديثات للنشر.'
            exit 0
          fi
          git commit -m 'تحديث غرفة أخبار نشهل'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'تم نشر مخرجات غرفة أخبار نشهل.'
              exit 0
            fi
            git rebase --abort || true
            git reset --soft origin/main
            git add data/news.json data/provenance.json articles sitemap.xml news-sitemap.xml robots.txt
            git commit -m 'تحديث غرفة أخبار نشهل' || true
            sleep 3
          done
          echo 'تعذر نشر التحديث بعد 3 محاولات.'
          exit 1
