name: News Bot

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/global_news_bot.py'
      - 'scripts/ai_analysis.py'
      - 'scripts/news_quality_gate.py'
      - 'scripts/build_site.py'
      - 'scripts/build_provenance.py'
      - '.github/workflows/news-bot.yml'
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: news-bot-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: AI event discovery and evidence collection
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/global_news_bot.py

      - name: Enforce freshness and verification quality gate
        run: python scripts/news_quality_gate.py

      - name: Generate editorial analysis
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/ai_analysis.py

      - name: Build SEO article pages and sitemaps
        run: python scripts/build_site.py

      - name: Build Nashhal Trust provenance manifest
        run: python scripts/build_provenance.py

      - name: Commit newsroom dataset and generated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nashhal-news-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/provenance.json articles sitemap.xml news-sitemap.xml robots.txt
          if git diff --cached --quiet; then echo 'لا توجد تحديثات.'; exit 0; fi
          git commit -m 'تحديث غرفة أخبار نشهل وبناء سجل الثقة والفهرسة'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'تم نشر تحديث غرفة الأخبار وسجل الثقة بنجاح.'
              exit 0
            fi
            git rebase --abort || true
            git reset --soft origin/main
            git add data/news.json data/provenance.json articles sitemap.xml news-sitemap.xml robots.txt
            git commit -m 'تحديث غرفة أخبار نشهل وبناء سجل الثقة والفهرسة' || true
            sleep 3
          done
          echo 'تعذر نشر التحديث بعد 3 محاولات.'
          exit 1
