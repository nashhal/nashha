name: Rebuild Nashhal pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_site.py'
      - 'web3.html'
      - 'trust.html'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build article pages and sitemaps
        run: python scripts/build_site.py

      - name: Commit generated pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nashhal-site-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles sitemap.xml news-sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo 'No generated page changes.'
            exit 0
          fi
          git commit -m 'تحديث صفحات نشهل بعد ترقية تجربة Trust'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
