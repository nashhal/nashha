name: نشر صحيفة الثورة الجنوبية على GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep deployments queued instead of cancelling a publish already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد GitHub Pages
        uses: actions/configure-pages@v5

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: إعادة بناء صفحات الأخبار
        run: python scripts/build_site.py

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
